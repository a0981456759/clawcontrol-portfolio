name: Generate actual offline demo screenshot
on:
  push:
    branches: [docs/verified-dashboard-screenshot-20261020]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshot:
    if: github.repository == 'a0981456759/clawcontrol-portfolio'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify current fixtures and JS
        run: |
          node --test
          node --check src/app.js
      - name: Render actual static demo using Chromium
        run: |
          mkdir -p docs/screenshots
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/clawcontrol-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          sleep 2
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          "$CHROME" --headless --no-sandbox --disable-dev-shm-usage --hide-scrollbars --window-size=1440,1400 --virtual-time-budget=3500 --screenshot=docs/screenshots/dashboard.png http://127.0.0.1:8787/
          test -s docs/screenshots/dashboard.png
          file docs/screenshots/dashboard.png
      - name: Commit screenshot to feature branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/dashboard.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture actual synthetic offline dashboard [skip ci]"
            git push origin HEAD:docs/verified-dashboard-screenshot-20261020
          fi
